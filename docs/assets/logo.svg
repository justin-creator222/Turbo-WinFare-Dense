<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Brand Neon Linear Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="turboMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#00f5ff" opacity="0.12" filter="url(#softAura)" />
  <circle cx="310" cy="280" r="120" fill="#a855f7" opacity="0.10" filter="url(#softAura)" />

  <!-- Outer Glassmorphic Rounded Squircle Frame -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#squircleBorder)" stroke-width="4.5" />
  
  <!-- Subtle Internal Highlight Rim -->
  <rect x="25" y="25" width="462" height="462" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Main Symbol Group -->
  <g filter="url(#coreGlow)">
    
    <!-- Outer Energy Orbit Ring -->
    <circle cx="256" cy="256" r="145" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" stroke-dasharray="14 10 4 10" opacity="0.45" />
    <circle cx="256" cy="256" r="128" fill="none" stroke="url(#purpleNeon)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35" />

    <!-- Falcon Wing Sweeps (Top Left Wing) -->
    <!-- Feather 1 -->
    <path d="M125 140 C175 120, 245 130, 285 175 C255 185, 205 190, 160 195 C135 175, 126 155, 125 140 Z" 
          fill="url(#cyanNeon)" opacity="0.95" />
    <!-- Feather 2 -->
    <path d="M102 188 C155 170, 228 185, 268 225 C235 235, 185 240, 142 242 C118 225, 108 202, 102 188 Z" 
          fill="url(#cyanNeon)" opacity="0.85" />
    <!-- Feather 3 -->
    <path d="M92 242 C140 230, 208 240, 245 275 C212 282, 168 285, 125 285 C103 270, 95 255, 92 242 Z" 
          fill="url(#purpleNeon)" opacity="0.8" />
    <!-- Feather 4 (Lower Tail Feather) -->
    <path d="M115 295 C158 290, 205 305, 232 335 C200 338, 160 340, 130 330 C118 318, 114 306, 115 295 Z" 
          fill="url(#purpleNeon)" opacity="0.7" />

    <!-- Falcon Head & Crest (Top Right) -->
    <!-- Falcon Crown / Crest -->
    <path d="M270 165 C305 138, 365 132, 405 148 C430 158, 448 170, 458 172 C436 186, 412 194, 396 200 C380 225, 358 252, 325 272 C320 244, 314 212, 288 190 Z" 
          fill="url(#cyanNeon)" />
    
    <!-- Falcon Eye Glow -->
    <circle cx="388" cy="168" r="7" fill="#ffffff" />
    <circle cx="388" cy="168" r="4" fill="#00f5ff" />
    
    <!-- Falcon Beak Hook -->
    <path d="M448 172 C458 174, 468 185, 452 195 C438 193, 428 188, 418 182 Z" fill="#38bdf8" />
    
    <!-- Neck / Throat Feathers -->
    <path d="M396 200 C382 226, 360 256, 332 278 C318 248, 320 218, 345 198 Z" fill="url(#purpleNeon)" opacity="0.9" />

    <!-- Aerodynamic Tail Swoop -->
    <path d="M215 340 C185 390, 135 435, 95 455 C130 422, 165 382, 190 348 Z" fill="url(#purpleNeon)" opacity="0.95" />
    <path d="M245 348 C220 405, 175 448, 142 465 C170 435, 202 396, 222 355 Z" fill="url(#cyanNeon)" opacity="0.8" />

    <!-- Turbocharger Housing & Volute (Integrated at Core) -->
    <!-- Volute Scroll -->
    <path d="M256 160 A96 96 0 1 1 170 290 L150 350 L195 350 L205 320 A96 96 0 0 1 256 160 Z" 
          fill="none" stroke="url(#turboMetal)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Compressor Outer Ring -->
    <circle cx="256" cy="256" r="78" fill="#0b1120" stroke="url(#cyanNeon)" stroke-width="5" />
    <circle cx="256" cy="256" r="64" fill="#050811" stroke="url(#purpleNeon)" stroke-width="2.5" />

    <!-- Turbo Compressor Impeller Blades -->
    <g stroke="url(#cyanNeon)" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- 8 Curved Impeller Blades -->
      <path d="M256 256 C262 235, 275 210, 288 198" />
      <path d="M256 256 C274 245, 302 240, 314 245" />
      <path d="M256 256 C270 268, 288 290, 292 308" />
      <path d="M256 256 C250 278, 248 305, 240 318" />
      <path d="M256 256 C238 274, 215 288, 198 292" />
      <path d="M256 256 C235 258, 208 252, 196 242" />
      <path d="M256 256 C240 240, 224 220, 220 204" />
      <path d="M256 256 C252 232, 255 205, 262 194" />
    </g>

    <!-- Turbo Center Spindle Hub -->
    <circle cx="256" cy="256" r="22" fill="#090d16" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="256" cy="256" r="10" fill="url(#cyanNeon)" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />

    <!-- High-Voltage Lightning Energy Bolt Across Center -->
    <polygon points="295,115 218,255 272,255 220,395 342,230 282,230" 
             fill="url(#lightningGlow)" stroke="#ffffff" stroke-width="2" />

    <!-- High-Energy Spark Discharges -->
    <line x1="330" y1="180" x2="355" y2="160" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="345" y1="168" x2="368" y2="175" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="175" y1="365" x2="150" y2="390" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="385" x2="135" y2="380" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="420" y1="230" x2="445" y2="245" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
